<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html, body, #root { margin: 0; min-height: 100%; background: #050505; }
      .boot-shell { position: fixed; inset: 0; display: grid; place-items: center; background: #050505; color: #f1f2f4; font-family: "Lexend Variable", system-ui, sans-serif; }
      .boot-card { display: flex; flex-direction: column; align-items: center; gap: 16px; }
      .boot-icon { display: block; width: 48px; height: 48px; border-radius: 8px; }
      .boot-title { margin: 0; font-size: 18px; font-weight: 600; }
      .boot-track { width: 120px; height: 2px; overflow: hidden; background: #1c1c1f; }
      .boot-track::after { content: ""; display: block; width: 40%; height: 100%; background: #b2b4bf; animation: boot-progress 1.4s linear infinite; }
      @keyframes boot-progress { from { transform: translateX(-100%); } to { transform: translateX(350%); } }
      @media (prefers-reduced-motion: reduce) { .boot-track::after { animation: none; } }
    </style>
    <title>Radianite</title>
  </head>

  <body>
    <div id="root">
      <div class="boot-shell" aria-label="Starting Radianite">
        <div class="boot-card">
          <img class="boot-icon" src="/app-icon.png" alt="" />
          <p class="boot-title">Radianite</p>
          <div class="boot-track"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src-ui/main.ts"></script>
  </body>
</html>
